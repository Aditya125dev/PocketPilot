version: '3.8'

services:
  # Persistent PostgreSQL Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: pocketpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pocketpilot_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocketpilot_pass_secure2026}
      POSTGRES_DB: ${POSTGRES_DB:-pocketpilot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocketpilot_user} -d ${POSTGRES_DB:-pocketpilot_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pocketpilot-network

  # FastAPI Python Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pocketpilot-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-pocketpilot_user}:${POSTGRES_PASSWORD:-pocketpilot_pass_secure2026}@postgres:5432/${POSTGRES_DB:-pocketpilot_db}
      SECRET_KEY: ${SECRET_KEY:-pocketpilot-super-secret-key-change-in-production-2026}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      CORS_ORIGINS: '["http://localhost", "http://localhost:80", "http://localhost:5173", "https://pocketpilot.duckdns.org", "http://pocketpilot.duckdns.org"]'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pocketpilot-network

  # React + Vite Static Frontend (Nginx Alpine)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pocketpilot-frontend
    restart: unless-stopped
    networks:
      - pocketpilot-network

  # Nginx Gateway & Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: pocketpilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - pocketpilot-network

volumes:
  postgres_data:
    name: pocketpilot_postgres_data

networks:
  pocketpilot-network:
    name: pocketpilot-network
    driver: bridge
