# PocketPilot — Nginx Gateway & Reverse Proxy Configuration
# Compatible with Docker Compose local dev, EC2 single/multi-instance, and AWS ALB HTTPS termination

upstream backend_upstream {
    server backend:8000;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
    keepalive 32;
}

# HTTP Server — Listens on Port 80
server {
    listen 80;
    server_name pocketpilot.duckdns.org localhost _;

    # Client body limit for CSV uploads (matches backend 5MB + overhead)
    client_max_body_size 10M;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Health check for ALB / external monitors
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # API endpoints -> Proxy to FastAPI Backend
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # API Documentation /docs and /openapi.json
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Frontend Single Page Application
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

# HTTPS Server block template for direct DuckDNS Let's Encrypt certificates (if not using AWS ALB)
# When deploying behind AWS Application Load Balancer, ALB terminates TLS and forwards HTTP with X-Forwarded-Proto: https
# To enable direct Let's Encrypt TLS on an EC2 instance:
# server {
#     listen 443 ssl http2;
#     server_name pocketpilot.duckdns.org;
#
#     ssl_certificate /etc/letsencrypt/live/pocketpilot.duckdns.org/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/pocketpilot.duckdns.org/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_ciphers HIGH:!aNULL:!MD5;
#     ssl_prefer_server_ciphers on;
#
#     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
#     ...
# }
